# 4 Charles Prime Rib - Resy availability checker
# Starts well before the 9:00 AM Eastern release window, then waits inside the job
# so the first API checks happen as close to 9:00:00 ET as GitHub allows.
# If GitHub starts the scheduled run late, still check and email the diagnostics.

name: Resy 4 Charles Check

on:
  schedule:
    # 6:07 AM Eastern in daylight time and standard time.
    - cron: '7 10 * * *'
    - cron: '7 11 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Prepare release window
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "manual=true" >> "$GITHUB_OUTPUT"
            echo "late_start=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          et_time="$(TZ=America/New_York date +%H:%M:%S)"
          et_hour="$(TZ=America/New_York date +%H)"
          et_minute="$(TZ=America/New_York date +%M)"
          et_offset="$(TZ=America/New_York date +%z)"
          hour=$((10#$et_hour))
          minute=$((10#$et_minute))

          echo "Current Eastern time: $et_time"
          echo "manual=false" >> "$GITHUB_OUTPUT"

          if [ "$et_offset" = "-0400" ]; then
            expected_schedule="7 10 * * *"
          else
            expected_schedule="7 11 * * *"
          fi

          if [ "${{ github.event.schedule }}" != "$expected_schedule" ]; then
            echo "Skipping wrong-season UTC schedule."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

          if [ "$hour" -gt 9 ] || { [ "$hour" -eq 9 ] && [ "$minute" -gt 0 ]; }; then
            echo "late_start=true" >> "$GITHUB_OUTPUT"
            echo "GitHub started this scheduled run after 9:00 AM Eastern. Continuing so diagnostics email is still sent."
          else
            echo "late_start=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until 9 AM Eastern
        if: steps.window.outputs.should_run == 'true' && steps.window.outputs.manual != 'true'
        run: |
          last_notice=""

          while true; do
            et_time="$(TZ=America/New_York date '+%H:%M:%S %Z')"
            et_hour="$(TZ=America/New_York date +%H)"
            et_minute="$(TZ=America/New_York date +%M)"
            notice_minute="$(TZ=America/New_York date +%H:%M)"
            hour=$((10#$et_hour))
            minute=$((10#$et_minute))

            if [ "$hour" -ge 9 ]; then
              break
            fi

            if [ "$notice_minute" != "$last_notice" ]; then
              echo "Dormant until 9:00 AM Eastern. Current time: $et_time"
              last_notice="$notice_minute"
            fi

            if [ "$hour" -eq 8 ] && [ "$minute" -ge 58 ]; then
              sleep 1
            else
              sleep 60
            fi
          done

          echo "Release window reached."

      - name: Record check start time
        if: steps.window.outputs.should_run == 'true'
        id: release
        run: |
          started_at="$(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Starting checks at $started_at"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.window.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: steps.window.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run self-tests
        if: steps.window.outputs.should_run == 'true'
        id: run_self_tests
        run: node --test check-resy.test.mjs

      - name: Check Resy availability (30 tries, 4s apart)
        if: steps.window.outputs.should_run == 'true'
        id: resy
        env:
          RESY_API_KEY: ${{ secrets.RESY_API_KEY }}
          RESY_AUTH_TOKEN: ${{ secrets.RESY_AUTH_TOKEN }}
        run: |
          available=false
          had_success=false
          : > attempt-log.txt

          write_outputs() {
            echo "available=$available" >> "$GITHUB_OUTPUT"

            if [ -s result.json ] && jq -e . result.json >/dev/null 2>&1; then
              status_value="$(jq -r '.status // "unknown"' result.json)"
              echo "status=$status_value" >> "$GITHUB_OUTPUT"
              echo "looked=$(jq -r '(.looked // false) | tostring' result.json)" >> "$GITHUB_OUTPUT"

              echo "summary<<EOF" >> "$GITHUB_OUTPUT"
              jq -r '
                [
                  "Status: " + (.status // "unknown"),
                  "Looked successfully: " + ((.looked // false) | tostring),
                  "Checked dates: " + ((.checked // []) | join(", ")),
                  "",
                  "Counts:",
                  (((.counts // []) | map("- \(.date): " + (if .ok then "API ok, \((.rawCount // 0) | tostring) raw slots, \((.matchedCount // 0) | tostring) matched preferences" else "API error (" + (.errorType // "unknown") + ")" end)) | join("\n"))),
                  (if ((.errors // []) | length) > 0 then "\nWarnings/errors:\n" + ((.errors // []) | map("- " + .) | join("\n")) else "\nResy API responded successfully for every checked date." end)
                ] | join("\n")
              ' result.json >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"

              echo "slots<<EOF" >> "$GITHUB_OUTPUT"
              jq -r '(.slots // [])[] | (if .preferred then "* " else "" end) + "\(.date) \(.time)\n\(.url)\n"' result.json >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
            else
              echo "status=invalid_result" >> "$GITHUB_OUTPUT"
              echo "looked=false" >> "$GITHUB_OUTPUT"
              echo "summary<<EOF" >> "$GITHUB_OUTPUT"
              echo "The checker did not produce valid JSON. Open the workflow log for details." >> "$GITHUB_OUTPUT"
              echo "EOF" >> "$GITHUB_OUTPUT"
            fi
          }

          for i in $(seq 1 30); do
            attempt_time="$(TZ=America/New_York date '+%H:%M:%S %Z')"
            echo "Attempt $i at $attempt_time"

            set +e
            node check-resy.mjs > result.json
            status=$?
            set -e

            cat result.json

            if [ -s result.json ] && jq -e . result.json >/dev/null 2>&1; then
              result_status="$(jq -r '.status // "unknown"' result.json)"
              result_looked="$(jq -r '(.looked // false) | tostring' result.json)"
              result_available="$(jq -r '(.available // false) | tostring' result.json)"
              result_auth_failed="$(jq -r '(.authFailed // false) | tostring' result.json)"
              result_raw_count="$(jq -r '[.counts[]?.rawCount // 0] | add // 0' result.json)"
              result_matched_count="$(jq -r '[.counts[]?.matchedCount // 0] | add // 0' result.json)"
              result_date_counts="$(jq -r '(.counts // []) | map(.date + ":" + (if .ok then "raw=" + ((.rawCount // 0) | tostring) + ",matched=" + ((.matchedCount // 0) | tostring) else "error=" + (.errorType // "unknown") end)) | join("; ")' result.json)"
            else
              result_status="invalid_result"
              result_looked="false"
              result_available="false"
              result_auth_failed="false"
              result_raw_count="0"
              result_matched_count="0"
              result_date_counts="no valid JSON"
            fi

            echo "Attempt $i at $attempt_time: exit=$status, status=$result_status, looked=$result_looked, authFailed=$result_auth_failed, available=$result_available, rawSlots=$result_raw_count, matchedSlots=$result_matched_count, dates=[$result_date_counts]" >> attempt-log.txt

            if [ "$status" -ne 0 ]; then
              echo "Checker returned status $status."
              if [ "$status" -eq 3 ] || [ "$result_auth_failed" = "true" ]; then
                echo "Auth failure is not retryable. Refresh RESY_API_KEY and RESY_AUTH_TOKEN in GitHub Secrets."
                write_outputs
                exit "$status"
              fi

              if [ "$i" -lt 30 ]; then
                sleep 4
                continue
              fi

              if [ "$had_success" = "true" ]; then
                echo "Final attempt failed, but an earlier attempt inspected Resy successfully. Reporting the last successful result."
                cp last-good-result.json result.json
                write_outputs
                exit 0
              fi

              write_outputs
              exit "$status"
            fi

            if [ "$result_looked" = "true" ]; then
              had_success=true
              cp result.json last-good-result.json
            fi

            if jq -e '.available == true' result.json >/dev/null 2>&1; then
              available=true
              echo "Slots found on attempt $i"
              break
            fi

            if [ "$i" -lt 30 ]; then sleep 4; fi
          done

          if [ "$available" != "true" ] && [ "$had_success" = "true" ]; then
            echo "Using last successful Resy response as final no-slots evidence."
            cp last-good-result.json result.json
          fi

          write_outputs

      - name: Build email diagnostics
        if: steps.window.outputs.should_run == 'true' && always()
        id: email
        run: |
          delimiter="EMAIL_BODY_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            echo "Quick summary:"
            if [ -s result.json ] && jq -e . result.json >/dev/null 2>&1; then
              summary_status="$(jq -r '.status // "unknown"' result.json)"
              summary_looked="$(jq -r '(.looked // false) | tostring' result.json)"
              summary_available="$(jq -r '(.available // false) | tostring' result.json)"
              summary_auth_failed="$(jq -r '(.authFailed // false) | tostring' result.json)"
              summary_raw_count="$(jq -r '[.counts[]?.rawCount // 0] | add // 0' result.json)"
              summary_matched_count="$(jq -r '[.counts[]?.matchedCount // 0] | add // 0' result.json)"
              summary_error_count="$(jq -r '(.errors // []) | length' result.json)"
              summary_checked_dates="$(jq -r '(.checked // []) | join(", ")' result.json)"
              summary_first_slot="$(jq -r 'if ((.slots // []) | length) > 0 then ((.slots[0].date // "unknown date") + " " + (.slots[0].time // "unknown time")) else "none" end' result.json)"
              summary_first_error="$(jq -r '(.errors // [])[0] // "none"' result.json)"

              if [ "$summary_available" = "true" ]; then
                summary_outcome="slots found"
              elif [ "$summary_auth_failed" = "true" ]; then
                summary_outcome="auth failed"
              elif [ "$summary_looked" = "true" ] && [ "$summary_error_count" -gt 0 ]; then
                summary_outcome="checked with some Resy errors"
              elif [ "$summary_looked" = "true" ]; then
                summary_outcome="checked, no matching slots"
              else
                summary_outcome="checker error"
              fi

              echo "- Outcome: $summary_outcome ($summary_status)"
              echo "- Slots: $summary_matched_count matching from $summary_raw_count raw"
              echo "- First matching slot: $summary_first_slot"
              echo "- Looked successfully: $summary_looked"
              echo "- Errors: $summary_error_count"
              echo "- First error: $summary_first_error"
              echo "- Auth failed: $summary_auth_failed"
              echo "- Checked dates: $summary_checked_dates"
            else
              echo "- Outcome: checker did not produce valid JSON"
              echo "- Slots: unknown"
              echo "- Errors: result.json missing or invalid"
            fi
            echo ""
            echo "Run metadata:"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Schedule: ${{ github.event.schedule }}"
            echo "- Late schedule start: ${{ steps.window.outputs.late_start }}"
            echo "- Ref: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Started at: ${{ steps.release.outputs.started_at }}"
            echo ""
            echo "Step outcomes:"
            echo "- Self-tests: ${{ steps.run_self_tests.outcome }}"
            echo "- Resy check: ${{ steps.resy.outcome }}"
            echo ""
            echo "Resy result:"
            echo "- Status: ${{ steps.resy.outputs.status }}"
            echo "- Looked successfully: ${{ steps.resy.outputs.looked }}"
            echo "- Available: ${{ steps.resy.outputs.available }}"
            if [ -s result.json ] && jq -e . result.json >/dev/null 2>&1; then
              echo "- Auth failed: $(jq -r '(.authFailed // false) | tostring' result.json)"
            else
              echo "- Auth failed: unknown"
            fi
            echo ""
            echo "Attempt log:"
            if [ -s attempt-log.txt ]; then
              cat attempt-log.txt
            else
              echo "No attempt log was written."
            fi
            echo ""
            echo "Check details:"
            if [ -s result.json ] && jq -e . result.json >/dev/null 2>&1; then
              jq -r '
                [
                  "Status: " + (.status // "unknown"),
                  "Looked successfully: " + ((.looked // false) | tostring),
                  "Checked dates: " + ((.checked // []) | join(", ")),
                  "",
                  "Counts:",
                  (((.counts // []) | map("- \(.date): " + (if .ok then "API ok, \((.rawCount // 0) | tostring) raw slots, \((.matchedCount // 0) | tostring) matched preferences" else "API error (" + (.errorType // "unknown") + ")" end)) | join("\n"))),
                  (if ((.errors // []) | length) > 0 then "\nWarnings/errors:\n" + ((.errors // []) | map("- " + .) | join("\n")) else "\nResy API responded successfully for every checked date." end)
                ] | join("\n")
              ' result.json
            else
              echo "No valid checker JSON was written."
            fi
            echo ""
            echo "Final result JSON:"
            if [ -s result.json ] && jq -e . result.json >/dev/null 2>&1; then
              jq . result.json
            elif [ -s result.json ]; then
              cat result.json
            else
              echo "No result.json was written."
            fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Call phone (slots available)
        if: steps.window.outputs.should_run == 'true' && success() && steps.resy.outputs.available == 'true'
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_PHONE: ${{ secrets.TWILIO_FROM_PHONE }}
          ALERT_PHONE: ${{ secrets.ALERT_PHONE }}
        run: |
          missing=false
          for name in TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN TWILIO_FROM_PHONE ALERT_PHONE; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; skipping phone call alert."
              missing=true
            fi
          done

          if [ "$missing" = "true" ]; then
            exit 0
          fi

          slot_count="$(jq -r '(.slots // []) | length' result.json)"
          first_slot="$(jq -r 'if ((.slots // []) | length) > 0 then ((.slots[0].date // "unknown date") + " " + (.slots[0].time // "unknown time")) else "unknown time" end' result.json)"
          message="4 Charles reservation alert. ${slot_count} matching slots found. First slot: ${first_slot}. Check your email and book immediately."
          twiml="$(jq -nr --arg message "$message" '<Response><Say voice="alice" language="en-US">\($message | @html)</Say><Pause length="1"/><Say voice="alice" language="en-US">4 Charles slots are available. Check your email now.</Say></Response>')"

          response="$(
            curl -sS -X POST "https://api.twilio.com/2010-04-01/Accounts/${TWILIO_ACCOUNT_SID}/Calls.json" \
              -u "${TWILIO_ACCOUNT_SID}:${TWILIO_AUTH_TOKEN}" \
              --data-urlencode "To=${ALERT_PHONE}" \
              --data-urlencode "From=${TWILIO_FROM_PHONE}" \
              --data-urlencode "Twiml=${twiml}" \
              --data-urlencode "Timeout=20" \
              -w '\n%{http_code}'
          )"

          http_code="$(printf '%s' "$response" | tail -n 1)"
          body="$(printf '%s' "$response" | sed '$d')"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::warning::Twilio call alert failed with HTTP $http_code."
            printf '%s\n' "$body"
            exit 0
          fi

          call_sid="$(printf '%s' "$body" | jq -r '.sid // "unknown"')"
          call_status="$(printf '%s' "$body" | jq -r '.status // "unknown"')"
          echo "Twilio call alert queued: sid=$call_sid status=$call_status"

      - name: Send email (slots available)
        if: steps.window.outputs.should_run == 'true' && success() && steps.resy.outputs.available == 'true'
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_USER }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: "4 Charles Prime Rib - Slots available"
          body: |
            Slots are available for 4 Charles Prime Rib (4 people).

            Slots found:
            ${{ steps.resy.outputs.slots }}

            ${{ steps.email.outputs.body }}

            Book here:
            https://resy.com/cities/new-york-ny/venues/4-charles-prime-rib?seats=4

            Resy 4 Charles checker - GitHub Actions

      - name: Send email (checked, no matching slots)
        if: steps.window.outputs.should_run == 'true' && success() && steps.resy.outputs.available != 'true'
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_USER }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: "4 Charles Prime Rib - Checked, no matching slots"
          body: |
            The checker ran and did not find matching 4-person slots.

            ${{ steps.email.outputs.body }}

            If "Looked successfully" is true and each date says "API ok", Resy responded and the checker was able to inspect availability.

            Resy 4 Charles checker - GitHub Actions

      - name: Send email (checker error)
        if: steps.window.outputs.should_run == 'true' && failure() && steps.resy.outcome != 'success'
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_USER }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: "4 Charles Prime Rib - Checker error"
          body: |
            The Resy checker hit an error, usually from expired Resy credentials or an API/security response.

            ${{ steps.email.outputs.body }}

            If the log mentions Resy credentials, pass the Resy security center again and update RESY_AUTH_TOKEN in repo Secrets.

            Resy 4 Charles checker - GitHub Actions
